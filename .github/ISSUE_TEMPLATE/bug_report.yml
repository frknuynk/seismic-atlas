name: Bug report
description: Report a reproducible defect in Seismic Atlas
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include credentials or security-sensitive details here; use private vulnerability reporting instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and its user impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open…
        2. Select…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: viewport
    attributes:
      label: Viewport
      options:
        - Desktop
        - Mobile
        - Both
        - API or Worker only
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Chromium 130, macOS 15
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove tokens, private data, and unrelated personal information.
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: This report does not contain a private security vulnerability.
          required: true
